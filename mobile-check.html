<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>预览：移动端检查</title>
<style>
  html { background: #0b0b12; }
  body { margin: 0; padding: 20px; display: flex; gap: 24px; align-items: flex-start;
         font: 12px/1.5 -apple-system, "PingFang SC", system-ui, sans-serif; color: #8a8aa3; }
  figure { margin: 0; }
  figcaption { padding: 0 2px 8px; letter-spacing: .06em; }
  iframe { display: block; border: 1px solid #22223a; border-radius: 14px; background: #05050d; }
</style>
</head>
<body>
  <figure>
    <figcaption>390 × 800 · iPhone</figcaption>
    <iframe src="index.html" width="390" height="800" title="390 宽预览"></iframe>
  </figure>
  <figure>
    <figcaption>768 × 800 · 平板</figcaption>
    <iframe src="index.html" width="768" height="800" title="768 宽预览"></iframe>
  </figure>
</body>
</html>
